[project]
name = "office2pdf"
version = "0.1.0"
description = "Fast structural inspection and high-fidelity PDF/image conversion for Word, Excel, and PowerPoint documents, tailored for multimodal LLMs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "openpyxl>=3.1.2",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pymupdf>=1.23.0",
]

[project.scripts]
office2pdf = "scripts.office2pdf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skills/office2pdf/scripts"]

[tool.pytest.ini_options]
pythonpath = [".", "skills/office2pdf"]
testpaths = ["tests"]


